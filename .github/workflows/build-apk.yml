name: Build Android APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: "4.3"

jobs:
  apk:
    runs-on: ubuntu-latest
    container: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Set up export templates
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
      - name: Create debug keystore and configure Godot
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          mkdir -p ~/.config/godot
          { echo "[gd_resource type=\"EditorSettings\" format=3]"; echo; echo "[resource]";
            echo "export/android/android_sdk_path = \"${ANDROID_HOME:-/usr/lib/android-sdk}\"";
            echo "export/android/debug_keystore = \"$(pwd)/debug.keystore\"";
            echo "export/android/debug_keystore_user = \"androiddebugkey\"";
            echo "export/android/debug_keystore_pass = \"android\"";
            echo "export/android/java_sdk_path = \"$(dirname $(dirname $(readlink -f $(which javac))))\""; } > ~/.config/godot/editor_settings-4.3.tres
          cat ~/.config/godot/editor_settings-4.3.tres
      - name: Export debug APK
        run: |
          ls /usr/lib/android-sdk /usr/lib/android-sdk/build-tools /usr/lib/android-sdk/platforms 2>&1 || true
          ls ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable | head -30
          godot --headless --import || true
          mkdir -v -p build
          godot --headless --verbose --export-debug "Android" build/the-last-scribe.apk
          ls -la build
      - uses: actions/upload-artifact@v4
        with:
          name: the-last-scribe-debug-apk
          path: build/the-last-scribe.apk
