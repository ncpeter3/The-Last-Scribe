name: Check project
on: [push, pull_request]
jobs:
  import:
    runs-on: ubuntu-latest
    container: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Import and load scripts headless
        run: godot --headless --import --quit
      - name: Play through chapter 1 (every story beat and challenge)
        run: |
          set -o pipefail
          timeout 300 godot --headless res://tools/test/playtest.tscn 2>&1 | grep -v 'mesh_get_surface_count\|Parameter "m" is null' | tee playtest.log
          if grep -q "SCRIPT ERROR" playtest.log; then echo "Script errors during playthrough"; exit 1; fi
        shell: bash
      - name: Play through chapter 2 (Cain and Abel)
        run: |
          set -o pipefail
          timeout 400 godot --headless res://tools/test/cain_playtest.tscn 2>&1 | grep -v 'mesh_get_surface_count\|Parameter "m" is null' | tee cain.log
          if grep -q "SCRIPT ERROR" cain.log; then echo "Script errors during playthrough"; exit 1; fi
          grep -q "CAIN PLAYTEST PASSED" cain.log
        shell: bash
      - name: Play through the opening home scene (family talks and time machine)
        run: |
          set -o pipefail
          timeout 300 godot --headless res://tools/test/home_playtest.tscn 2>&1 | grep -v 'mesh_get_surface_count\|Parameter "m" is null' | tee home.log
          if grep -q "SCRIPT ERROR" home.log; then echo "Script errors during playthrough"; exit 1; fi
        shell: bash
      - name: Play through the start screen (title, scribe choice, story intro)
        run: |
          set -o pipefail
          timeout 300 godot --headless res://tools/test/start_playtest.tscn 2>&1 | grep -v 'mesh_get_surface_count\|Parameter "m" is null' | tee start.log
          if grep -q "SCRIPT ERROR" start.log; then echo "Script errors during playthrough"; exit 1; fi
          grep -q "START PLAYTEST PASSED" start.log
        shell: bash
      - name: Check the dialogue box, task tracker and bumps
        run: |
          set -o pipefail
          timeout 120 godot --headless res://tools/test/ui_test.tscn 2>&1 | grep -v 'mesh_get_surface_count\|Parameter "m" is null' | tee ui.log
          if grep -q "SCRIPT ERROR" ui.log; then echo "Script errors in UI test"; exit 1; fi
        shell: bash
      - name: Check every question fits on phone and tablet screens
        run: |
          set -o pipefail
          timeout 120 godot --headless res://tools/test/choice_shots.tscn 2>&1 | grep -v 'mesh_get_surface_count\|Parameter "m" is null' | tee choice.log
          if grep -q "SCRIPT ERROR" choice.log; then echo "Script errors in choice test"; exit 1; fi
        shell: bash
