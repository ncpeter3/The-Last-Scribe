name: Check project
on: [push, pull_request]
jobs:
  import:
    runs-on: ubuntu-latest
    container: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Import and load scripts headless
        run: godot --headless --import --quit
      - name: Play through chapter 1 (every story beat and challenge)
        run: timeout 300 godot --headless res://tools/test/playtest.tscn 2>&1 | grep -v 'mesh_get_surface_count\|Parameter "m" is null' ; exit ${PIPESTATUS[0]}
        shell: bash
